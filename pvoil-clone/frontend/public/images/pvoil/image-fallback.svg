<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PVOIL image fallback</title>
  <desc id="desc">Local placeholder used when source site blocks direct image requests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d3b66"/>
      <stop offset="100%" stop-color="#ef3d32"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.9" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="800" y="430" font-size="84" font-weight="700">PVOIL</text>
    <text x="800" y="505" font-size="34" opacity="0.85">Asset fallback (local)</text>
  </g>
</svg>
